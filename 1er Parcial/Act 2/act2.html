<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil - Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body>
  <div class="d-flex justify-content-center align-items-center vh-100 bg-light">
    <div class="card border border-primary rounded-4 shadow-lg p-4" style="max-width: 400px; width: 100%;">
      <div class="d-flex justify-content-center mb-3">
        <div class="rounded-circle shadow bg-primary d-flex align-items-center justify-content-center" 
             style="width: 100px; height: 100px; font-size: 2.5rem; color: white;">
          <i class="bi bi-person-fill"></i>
        </div>
      </div>
      <h2 class="text-center fw-bold text-primary mb-0">Edswin Waldo</h2>
      <p class="text-center text-secondary-emphasis mb-3">Desarrollador Fullstack</p>
      <div class="d-flex flex-wrap justify-content-center gap-2 mb-4">
        <span class="badge bg-primary bg-opacity-10 text-primary border border-primary px-3 py-2 rounded-pill">
          HTML
        </span>
        <span class="badge bg-primary bg-opacity-10 text-primary border border-primary px-3 py-2 rounded-pill">
          CSS
        </span>
        <span class="badge bg-primary bg-opacity-10 text-primary border border-primary px-3 py-2 rounded-pill">
          JavaScript
        </span>
        <span class="badge bg-primary bg-opacity-10 text-primary border border-primary px-3 py-2 rounded-pill">
          Bootstrap
        </span>
        <span class="badge bg-primary bg-opacity-10 text-primary border border-primary px-3 py-2 rounded-pill">
          React
        </span>
      </div>
      <div class="d-grid">
        <button class="btn btn-outline-primary rounded-pill py-2 fw-semibold">
          <i class="bi bi-envelope me-2"></i> Contactar
        </button>
      </div>
    </div>
  </div>
</body>
</html>
